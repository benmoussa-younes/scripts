name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev lintian

      - name: Install reuse
        run: |
          pipx install reuse==5.0.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Gate (build, AOT app, helpers, packaging, shellcheck, AOT tests, licences)
        run: bash tools/scripts/binaries/check-all.sh

      - name: Verify tag matches the version
        run: |
          version="$(sh tools/scripts/binaries/version.sh)"
          test "$version" = "${TAG#v}"

      - name: Build Debian package and tarballs
        run: |
          bash packaging/build-deb.sh
          bash packaging/build-tarballs.sh --skip-deb

      - name: Verify release evidence against the signed tag
        run: |
          gpg --batch --import packaging/maintainer-key.asc
          bash packaging/verify-release.sh --write
          bash packaging/verify-release.sh --require-tag

      - name: Smoke-test the package
        run: bash packaging/smoke-test.sh

      - name: Generate SPDX SBOM and collect assets
        run: |
          mkdir -p artifacts
          cp packaging/*.deb packaging/*.tar.gz packaging/SHA256SUMS \
            packaging/tarballs.sha256 packaging/RELEASE-EVIDENCE artifacts/
          pipx run reuse==5.0.2 spdx > artifacts/scripts.spdx

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/*

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          if-no-files-found: error
          path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-assets
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "Scripts ${TAG}" \
              --generate-notes \
              artifacts/*
          fi
