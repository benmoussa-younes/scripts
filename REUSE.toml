version = 1

# Every path is GPL-3.0-or-later by default. The annotations below override the
# paths that carry another id; they must stay after this one, because the last
# matching table wins.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Younes BENMOUSSA <younes.benmoussa@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["src/**", "tests/**", "tools/**", "packaging/**"]
SPDX-FileCopyrightText = "2026 Younes BENMOUSSA <younes.benmoussa@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["README.md", "AGENTS.md", "CHANGELOG.md", "THIRD-PARTY"]
SPDX-FileCopyrightText = "2026 Younes BENMOUSSA <younes.benmoussa@pm.me>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["LICENSE"]
SPDX-FileCopyrightText = "2026 Younes BENMOUSSA <younes.benmoussa@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["LICENSES/GPL-3.0-or-later.txt"]
